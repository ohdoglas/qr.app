services:
  - type: web
    name: qrapp-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    branch: main
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: QR_STORAGE_PROVIDER
        value: supabase
      - key: GOOGLE_SAFE_BROWSING_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: supabaseURL
        sync: false
      - key: supabaseKey
        sync: false
      - key: GOOGLE_SAFE_BROWSING_KEY
        sync: false
